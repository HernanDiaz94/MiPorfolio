<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada · Hernan Diaz</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --acento: #2563eb;
        --borde: #e2e8f0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --card: #0f172a;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --acento: #60a5fa;
          --borde: #1e293b;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }

      main {
        background: var(--card);
        border: 1px solid var(--borde);
        border-radius: 18px;
        padding: 2.5rem 2rem;
        max-width: 26rem;
        text-align: center;
      }

      .code {
        margin: 0;
        font-size: 4.5rem;
        font-weight: 800;
        line-height: 1;
        color: var(--acento);
      }

      h1 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.25rem;
      }

      .msg {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .btn {
        display: inline-block;
        background: var(--acento);
        color: #ffffff;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.7rem 1.4rem;
        border-radius: 10px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Página no encontrada</h1>
      <p class="msg">La página que buscás no existe o fue movida.</p>
      <a class="btn" href="/">Volver al inicio</a>
    </main>
  </body>
</html>
