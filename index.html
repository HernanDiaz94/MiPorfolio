    <script>
      // Aplica el tema antes del primer paint para evitar el parpadeo.
      (function () {
        try {
          var tema = localStorage.getItem('theme');
          var oscuro =
            tema === 'dark' ||
            (!tema && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
